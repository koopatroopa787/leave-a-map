<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Leave a Map: approve what's sent</title>
    <style>
      /* Same colour tokens as the scan site (apps/scan/src/styles.css): black, off-white, one orange. System fonts: this site's CSP has no font-src. */
      :root {
        color-scheme: dark light;
        --paper: oklch(0% 0 0); --surface: oklch(9% 0 0); --sunk: oklch(20.5% 0 0);
        --ink: oklch(88.5% 0.012 125); --muted: oklch(72% 0 0); --line: oklch(30% 0 0); --line-strong: oklch(56% 0 0);
        --accent: oklch(70.5% 0.19 47); --accent-hover: oklch(76% 0.16 55); --accent-fg: oklch(0% 0 0); --accent-soft: oklch(17% 0 0);
        --focus: oklch(76% 0.16 55); --warn-fg: oklch(86% 0.12 85); --warn-soft: oklch(24% 0.05 80); --cloud: oklch(20.5% 0 0);
        --dash: 1px solid var(--line);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --paper: oklch(100% 0 0); --surface: oklch(100% 0 0); --sunk: oklch(96.5% 0 0);
          --ink: oklch(14.5% 0 0); --muted: oklch(43.5% 0 0); --line: oklch(87% 0 0); --line-strong: oklch(55% 0 0);
          --accent: oklch(53% 0.17 40); --accent-hover: oklch(47% 0.155 38); --accent-fg: oklch(100% 0 0); --accent-soft: oklch(95.5% 0.03 55);
          --focus: oklch(53% 0.17 40); --warn-fg: oklch(43% 0.1 65); --warn-soft: oklch(95.5% 0.045 85); --cloud: oklch(96.5% 0 0);
        }
      }
      @media (prefers-contrast: more) { :root { --muted: var(--ink); --line: var(--line-strong); } }
      * { box-sizing: border-box; }
      html, body { overflow-x: clip; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 36rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; }
      h1 { font: 700 clamp(1.6rem, 1.1rem + 2.4vw, 2.25rem)/1.08 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.035em; margin: 0 0 .75rem; text-wrap: balance; }
      h2 { font: 700 .8rem/1.4 ui-monospace, "Cascadia Mono", monospace; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 0 0 .5rem; }
      p { text-wrap: pretty; }
      .what { background: var(--cloud); border: var(--dash); padding: 1rem 1.15rem; margin: 1.25rem 0; }
      .what ul { margin: 0; padding-left: 1.2rem; }
      .what li + li { margin-top: .35rem; }
      a { color: var(--accent); text-underline-offset: .18em; }
      .bulk { display: flex; flex-wrap: wrap; gap: .5rem; }
      .rows { list-style: none; padding: 0; margin: 1rem 0; background: var(--surface); border: var(--dash); overflow: hidden; }
      .rows li + li { border-top: 1px solid var(--line); }
      .rows label { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; min-height: 3rem; padding: .6rem 1rem; cursor: pointer; transition: background 140ms; }
      .rows label:hover { background: var(--sunk); }
      .rows label:has(input:checked) { background: var(--accent-soft); }
      .domain { font-family: ui-monospace, "Cascadia Mono", monospace; font-weight: 600; overflow-wrap: anywhere; }
      .tag { font-size: .8rem; font-weight: 700; padding: .1rem .5rem; background: var(--warn-soft); color: var(--warn-fg); }
      input[type=checkbox] { width: 1.3rem; height: 1.3rem; accent-color: var(--accent); flex: none; margin: 0; cursor: pointer; }
      input:disabled { cursor: not-allowed; }
      .adult { display: flex; align-items: center; gap: .65rem; min-height: 2.75rem; font-weight: 700; margin: .75rem 0 0; cursor: pointer; }
      .hint { color: var(--muted); min-height: 1.6em; margin: .5rem 0 1rem; font-size: .9rem; }
      .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
      button { font: inherit; font-weight: 700; min-height: 2.75rem; padding: .6rem 1.15rem; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); cursor: pointer; transition: background 140ms, border-color 140ms, transform 140ms; }
      button:hover { background: var(--sunk); border-color: var(--muted); }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--accent); border-color: var(--accent); border-style: solid; color: var(--accent-fg); }
      button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      #consent-done, #consent-busy, #consent-error, #consent-progress { padding: 1rem 1.15rem; background: var(--surface); border: var(--dash); font-weight: 600; }
      #consent-done { background: var(--accent-soft); border: 1px solid var(--accent); }
      @media (prefers-reduced-motion: no-preference) {
        main > * { animation: rise 420ms cubic-bezier(.22, 1, .36, 1) backwards; }
        main > :nth-child(2) { animation-delay: 50ms; } main > :nth-child(3) { animation-delay: 100ms; } main > :nth-child(n+4) { animation-delay: 150ms; }
      }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (forced-colors: active) { .rows, .what, .tag { border: 1px solid CanvasText; } }
    </style>
  </head>
  <body>
    <main id="app"><p>Waiting for the list from Leave a Map…</p></main>
    <script type="module" src="./src/consent.ts"></script>
  </body>
</html>
